name: Image

# Builds images of the pushed commit, one per flavor in parallel, and publishes
# them to GHCR, so deployments of this fork pull a ready image instead of
# compiling. Tags: <branch>-<flavor> (moving) and sha-<commit>-<flavor> (pin
# this one).
on:
  push:
    branches:
      - rb-all
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: stealth
            features: stealth
          - flavor: render-stealth
            features: render,stealth
          - flavor: plain
            features: ''
          - flavor: render
            features: render
    # glibc 2.35, not newer than the distroless runtime's 2.36.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install stealth build dependencies
        if: contains(matrix.features, 'stealth')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: image-${{ matrix.flavor }}

      - name: Build
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo build --release -p obscura-cli --bins --no-default-features --features "$FEATURES"

      - name: Build and push image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          branch="${REF_NAME//\//-}"
          mkdir image
          cp target/release/obscura target/release/obscura-worker image/
          cat > image/Dockerfile <<'EOF'
          FROM gcr.io/distroless/cc-debian12:nonroot
          COPY obscura obscura-worker /
          EXPOSE 9222
          ENTRYPOINT ["/obscura"]
          CMD ["serve", "--port", "9222", "--host", "0.0.0.0"]
          EOF
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build image \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$image:$branch-$FLAVOR" -t "$image:sha-${GITHUB_SHA}-$FLAVOR"
          docker push "$image:$branch-$FLAVOR"
          docker push "$image:sha-${GITHUB_SHA}-$FLAVOR"
